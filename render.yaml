services:
  - type: worker
    name: pentimento-bot
    runtime: node
    region: frankfurt
    buildCommand: npm install
    startCommand: npm run bot
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: ACTIVE_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GROQ_MODEL
        value: qwen/qwen3.6-27b
      - key: PENTIMENTO_DEBUG
        value: "1"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
